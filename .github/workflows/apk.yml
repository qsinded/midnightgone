name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      # ponytail: debug-signed APK installs on any phone via sideloading. Play Store needs a release-signed AAB instead.
      - name: Build APK
        run: ./gradlew assembleDebug
      - name: Name it
        run: cp app/build/outputs/apk/debug/app-debug.apk phonelock.apk
      - uses: actions/upload-artifact@v4
        with:
          name: phonelock-apk
          path: phonelock.apk
      - name: Attach to Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: phonelock.apk
